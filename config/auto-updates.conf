# /etc/auto-updates/auto-updates.conf
# Configuration for Auto-Updates CLI & Systemd Service
# Supports Fedora, Rocky Linux, AlmaLinux, RHEL, CentOS Stream, Debian, and Ubuntu

# Update Mode:
#   security   - Install security updates daily at SCHEDULE_TIME (default).
#                Non-security updates are not installed automatically.
#   all        - Install all available updates every day at SCHEDULE_TIME.
#   weekly-all - Install security updates daily at SCHEDULE_TIME, AND
#                install all (non-security + security) updates weekly on WEEKLY_DAY.
#                (also accepts alias 'all-weekly')
MODE=security

# Daily update execution time (24-hour local time format: HH:MM)
SCHEDULE_TIME=03:30

# Day of week to execute full updates when MODE=weekly-all
# Valid options: Sun, Mon, Tue, Wed, Thu, Fri, Sat
WEEKLY_DAY=Sun

# Maximum randomized delay in seconds (0 = disabled, default: 10)
# A small jitter prevents spikes across synchronized fleets
RANDOM_SLEEP=10

# Reboot policy after successful package updates:
#   never        - Never reboot automatically (default)
#   when-needed  - Reboot only if kernel/system libraries require it (needs-restarting -r)
#   when-changed - Reboot whenever any package is updated
REBOOT=never

# Delay before rebooting (in minutes) when REBOOT policy triggers:
#   0 - Reboot immediately via systemctl reboot (default, recommended for VMs and servers)
#   N - Schedule reboot in N minutes via shutdown -r +N (with broadcast wall notification)
REBOOT_DELAY=0

# Defer automated reboot if the system is busy (e.g. active builds or user sessions):
#   true  - Check for active compilers/builds (rpmbuild, make, ninja, cargo) and
#           systemd-inhibit locks before rebooting. Postpones reboot if busy. (default)
#   false - Proceed with reboot schedule regardless of active background processes
DEFER_REBOOT_IF_BUSY=true

# Notification / Emitter mechanism:
#   stdio - Output to journal / syslog (viewable with journalctl -u auto-updates)
#   motd  - Write update summaries to /etc/motd.d/dnf5-automatic (login banner)
#   email - Send email via dnf-automatic email configuration
EMIT_VIA=stdio

# Force remote repository metadata refresh before checking or applying updates:
#   true  - Query remote mirrors for fresh metadata before each run (default, recommended)
#   false - Rely on DNF's local metadata cache (respects metadata_expire)
REFRESH_METADATA=true

# Custom log file path (default: /var/log/auto-updates/auto-updates.log)
LOG_FILE=/var/log/auto-updates/auto-updates.log
