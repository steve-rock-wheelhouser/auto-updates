# /etc/auto-updates/auto-updates.conf
# Configuration for Auto-Updates CLI & Systemd Service

# Update Mode:
#   security  - Install security updates daily at SCHEDULE_TIME.
#               Non-security updates are not installed automatically.
#   all       - Install security updates daily at SCHEDULE_TIME, AND
#               install all (non-security + security) updates weekly on WEEKLY_DAY.
#   daily-all - Install all updates every single day at SCHEDULE_TIME.
MODE=security

# Daily update execution time (24-hour local time format: HH:MM)
SCHEDULE_TIME=03:30

# Day of week to execute full updates when MODE=all
# Valid options: Sun, Mon, Tue, Wed, Thu, Fri, Sat
WEEKLY_DAY=Sun

# Maximum randomized delay in seconds (0 = disabled, default: 10)
# A small jitter prevents spikes across synchronized fleets
RANDOM_SLEEP=10

# Reboot policy after successful package updates:
#   never        - Never reboot automatically (default)
#   when-needed  - Reboot only if kernel/system libraries require it (needs-restarting -r)
#   when-changed - Reboot whenever any package is updated
REBOOT=never

# Notification / Emitter mechanism:
#   stdio - Output to journal / syslog (viewable with journalctl -u auto-updates)
#   motd  - Write update summaries to /etc/motd.d/dnf5-automatic (login banner)
#   email - Send email via dnf-automatic email configuration
EMIT_VIA=stdio

# Custom log file path (default: /var/log/auto-updates.log)
LOG_FILE=/var/log/auto-updates.log
