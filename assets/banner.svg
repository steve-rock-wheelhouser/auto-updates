<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="45%" stop-color="#0a1428" />
      <stop offset="85%" stop-color="#0c1932" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>

    <radialGradient id="banner-glow-left" cx="24%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="banner-glow-right" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradients -->
    <linearGradient id="border-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1b34" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#070e1c" stop-opacity="0.90" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.10" />
    </linearGradient>

    <!-- Icon Embedded Gradients -->
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="50%" stop-color="#0e1a36" />
      <stop offset="100%" stop-color="#060a14" />
    </linearGradient>

    <linearGradient id="arrow-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="arrow-bottom" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14284b" />
      <stop offset="60%" stop-color="#0b172e" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>

    <linearGradient id="shield-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-banner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
    <filter id="glow-check" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .font-sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono  { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
  </style>

  <!-- Banner Background -->
  <rect x="0" y="0" width="1280" height="640" rx="24" ry="24" fill="url(#bg-banner)" />

  <!-- Ambient Glows -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#banner-glow-left)" />
  <rect x="0" y="0" width="1280" height="640" fill="url(#banner-glow-right)" />

  <!-- Decorative Tech Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="640" />
    <line x1="240" y1="0" x2="240" y2="640" />
    <line x1="400" y1="0" x2="400" y2="640" />
    <line x1="560" y1="0" x2="560" y2="640" />
    <line x1="720" y1="0" x2="720" y2="640" />
    <line x1="880" y1="0" x2="880" y2="640" />
    <line x1="1040" y1="0" x2="1040" y2="640" />
    <line x1="1200" y1="0" x2="1200" y2="640" />
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="560" x2="1280" y2="560" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="8" y="8" width="1264" height="624" rx="20" ry="20" fill="none" stroke="url(#border-banner)" stroke-width="2.5" />

  <!-- ============================================================== -->
  <!-- LEFT HERO SECTION: EMBEDDED HIGH-DEF ICON ARTWORK              -->
  <!-- ============================================================== -->
  <g id="hero-icon" transform="translate(70, 110)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="420" height="420" rx="98" ry="98" fill="url(#icon-bg)" stroke="url(#border-banner)" stroke-width="5" filter="url(#shadow-banner)" />
    <!-- Center Glow -->
    <circle cx="210" cy="210" r="180" fill="#38bdf8" fill-opacity="0.12" />
    <!-- Orbital Rings -->
    <circle cx="210" cy="210" r="170" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="2" />
    <circle cx="210" cy="210" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="7 11" />
    <circle cx="210" cy="210" r="100" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="4 8" />

    <!-- Dual Sync Arrows -->
    <g>
      <!-- Top Arc -->
      <path d="M 85 150 A 140 140 0 0 1 346 175" fill="none" stroke="url(#arrow-top)" stroke-width="21" stroke-linecap="round" />
      <polygon points="353,203 325,166 345,172 362,157" fill="#3b82f6" stroke="url(#arrow-top)" stroke-width="2" stroke-linejoin="round" />

      <!-- Bottom Arc -->
      <path d="M 335 270 A 140 140 0 0 1 74 245" fill="none" stroke="url(#arrow-bottom)" stroke-width="21" stroke-linecap="round" />
      <polygon points="67,217 95,254 75,248 58,263" fill="#00f2fe" stroke="url(#arrow-bottom)" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Shield Emblem -->
    <g transform="translate(210, 210) scale(0.44) translate(-512, -512)">
      <path d="M 512 340 C 560 340 642 355 656 375 C 660 440 655 530 635 590 C 605 675 530 730 512 748 C 494 730 419 675 389 590 C 369 530 364 440 368 375 C 382 355 464 340 512 340 Z"
            fill="url(#shield-grad)" stroke="url(#shield-border)" stroke-width="12" stroke-linejoin="round" />
      <path d="M 512 346 C 468 346 392 360 378 378 C 375 440 379 525 397 583 C 425 662 494 715 512 738 L 512 346 Z" fill="#ffffff" fill-opacity="0.08" />
      <path d="M 442 535 L 492 585 L 588 475" fill="none" stroke="url(#check-grad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-check)" />
      <path d="M 442 535 L 492 585 L 588 475" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT CONTENT SECTION: TYPOGRAPHY, VALUE PILLS & TERMINAL HUD  -->
  <!-- ============================================================== -->
  <g transform="translate(540, 95)">
    <!-- Top Pill Badges -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="124" height="28" rx="14" ry="14" fill="#0284c7" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1.2" />
      <text x="62" y="19" class="font-sans" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">GPL-3.0</text>

      <rect x="134" y="0" width="146" height="28" rx="14" ry="14" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-width="1.2" />
      <text x="207" y="19" class="font-sans" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">MULTI-DISTRO</text>

      <rect x="290" y="0" width="138" height="28" rx="14" ry="14" fill="#6366f1" fill-opacity="0.20" stroke="#818cf8" stroke-width="1.2" />
      <text x="359" y="19" class="font-sans" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="1">SYSTEMD NATIVE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" class="font-title" font-size="56" fill="url(#title-grad)" letter-spacing="-1">Auto-Updates</text>

    <!-- Subtitle -->
    <text x="0" y="122" class="font-sans" font-size="20" font-weight="500" fill="#38bdf8">Turnkey Automated Package Maintenance for Linux</text>

    <!-- Bullet / Feature Grid (4 items) -->
    <g transform="translate(0, 155)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="5" fill="#38bdf8" />
        <text x="26" y="14" class="font-sans" font-size="14" font-weight="600" fill="#f8fafc">Daily Zero-Day Security</text>
        <text x="26" y="30" class="font-sans" font-size="12" fill="#94a3b8">Fast Mon–Sat vulnerability protection</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(240, 0)">
        <circle cx="10" cy="10" r="5" fill="#34d399" />
        <text x="26" y="14" class="font-sans" font-size="14" font-weight="600" fill="#f8fafc">Weekly Full Upgrades</text>
        <text x="26" y="30" class="font-sans" font-size="12" fill="#94a3b8">Sane Sunday full system maintenance</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 52)">
        <circle cx="10" cy="10" r="5" fill="#fbbf24" />
        <text x="26" y="14" class="font-sans" font-size="14" font-weight="600" fill="#f8fafc">Build-Inhibitor Protection</text>
        <text x="26" y="30" class="font-sans" font-size="12" fill="#94a3b8">Never reboots during active builds or tasks</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(240, 52)">
        <circle cx="10" cy="10" r="5" fill="#a78bfa" />
        <text x="26" y="14" class="font-sans" font-size="14" font-weight="600" fill="#f8fafc">Universal Distribution</text>
        <text x="26" y="30" class="font-sans" font-size="12" fill="#94a3b8">Fedora • Rocky • Alma • Debian • Ubuntu</text>
      </g>
    </g>

    <!-- Terminal HUD Preview Panel -->
    <g transform="translate(0, 275)" filter="url(#shadow-banner)">
      <rect x="0" y="0" width="670" height="150" rx="14" ry="14" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1.5" />
      
      <!-- Window Title Bar -->
      <rect x="0" y="0" width="670" height="32" rx="14" ry="14" fill="#0a1426" fill-opacity="0.8" />
      <!-- Traffic Light Dots -->
      <circle cx="20" cy="16" r="5" fill="#ef4444" fill-opacity="0.8" />
      <circle cx="36" cy="16" r="5" fill="#f59e0b" fill-opacity="0.8" />
      <circle cx="52" cy="16" r="5" fill="#10b981" fill-opacity="0.8" />
      <text x="75" y="20" class="font-mono" font-size="11" fill="#64748b">terminal: auto-updates status</text>

      <!-- Terminal Output Lines -->
      <text x="20" y="58" class="font-mono" font-size="13" fill="#38bdf8" font-weight="600">$ auto-updates status</text>
      <text x="20" y="80" class="font-mono" font-size="12" fill="#94a3b8">  Timer Status        : <tspan fill="#34d399" font-weight="700">active (running)</tspan> (enabled)</text>
      <text x="20" y="100" class="font-mono" font-size="12" fill="#94a3b8">  Configured Mode     : <tspan fill="#f8fafc" font-weight="600">weekly-all</tspan> (Daily Security + Sunday Full)</text>
      <text x="20" y="120" class="font-mono" font-size="12" fill="#94a3b8">  Reboot Policy       : <tspan fill="#38bdf8">when-needed</tspan> • <tspan fill="#fbbf24">build-protection: active</tspan></text>
      <text x="20" y="138" class="font-mono" font-size="12" fill="#94a3b8">  System Status       : <tspan fill="#34d399">Clean</tspan> (No reboot required)</text>
    </g>
  </g>
</svg>
